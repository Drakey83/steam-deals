<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://*.steamstatic.com https://*.akamaihd.net data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <title>Steam Deals</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="titlebar" class="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="8" cy="8" r="2.6" /><circle cx="16" cy="16" r="2.6" /><path d="M17 7 7 17" />
          </svg>
        </span>
        <span class="brand-name">Steam Deals</span>
      </div>
      <div id="titlebar-status" class="titlebar-status" aria-live="polite"></div>
    </header>

    <div id="progress" class="progress" hidden>
      <div class="progress-bar"></div>
    </div>

    <main id="app" class="app"></main>

    <div id="scrim" class="scrim"></div>
    <aside id="drawer" class="drawer" aria-hidden="true"></aside>
    <div id="modal" class="modal" aria-hidden="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
