<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Steam Deals</title>
    <meta name="description" content="Find Steam games you'll actually like and don't already own. Sign in through Steam and get the best current sales ranked by your own taste." />
    <meta property="og:title" content="Steam Deals" />
    <meta property="og:description" content="The best Steam sales, minus everything you already own, ranked by what you actually play." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Steam Deals" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="web">
    <header id="titlebar" class="titlebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="8" cy="8" r="2.6" /><circle cx="16" cy="16" r="2.6" /><path d="M17 7 7 17" />
          </svg>
        </span>
        <span class="brand-name">Steam Deals</span>
      </div>
      <div id="titlebar-status" class="titlebar-status" aria-live="polite"></div>
    </header>

    <div id="progress" class="progress" hidden>
      <div class="progress-bar"></div>
    </div>

    <main id="app" class="app"></main>

    <div id="scrim" class="scrim"></div>
    <aside id="drawer" class="drawer" aria-hidden="true"></aside>
    <div id="modal" class="modal" aria-hidden="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript><p style="padding:24px;color:#e6edf3">Steam Deals needs JavaScript turned on.</p></noscript>
    <script src="/core.js"></script>
    <script type="module" src="/web-api.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
